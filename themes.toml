# Story themes and romance tropes for `ebook-gen generate --theme KEY --trope KEY`.
# List them with `ebook-gen themes`.
#
# Each top-level [table] is one theme; its key is what --theme takes and what
# goes into the story ID, so keep it lowercase letters, digits and underscores.
# Add a table to add a theme.
#
#   name            display name (TUI, `ebook-gen themes`)
#   description     one line saying what the theme does
#   story_prompt    system prompt for step 2, which rewrites the story
#   motif_map       how chapters of Stith Thompson's Motif-Index of
#                   Folk-Literature appear in this setting; the rewrite keeps
#                   the tale's ATU type and core motifs and changes their
#                   surface through this map
#   image_keywords  visual vocabulary for step 5: given to the prompt model and
#                   appended to every image prompt, so images stay on-theme
#   adult           true for adult themes (optional, default false): the
#                   rewrite gets [defaults] adult_rules, and image prompts get
#                   adult_image_keywords
#
# A theme table can also set any [defaults] template to override it for that
# theme. "unmodified" is built in (no rewrite, no image keywords); its table
# only takes name, description and template overrides.
#
# [tropes.KEY] tables are romance tropes (name, description, guidance). Pick
# any number with --trope; they work with any theme except unmodified, and
# always bring the adult rules with them.
#
# Sources: the Aarne-Thompson-Uther (ATU) tale type index (Uther 2004) for the
# ATU division themes; Thompson's Motif-Index (1955-58) chapter letters for the
# motif maps; https://bound2books.com/smut-guide-genres-tropes/ for the adult
# genres and tropes. Young Adult Romance is left out: it's written for teens.

# Prompt templates every theme shares. {placeholders} are filled in at run time
# (write literal braces as {{ }}):
#
#   {theme}          theme key, e.g. caribbean_village
#   {theme_name}     theme display name, e.g. Caribbean Village
#   {theme_visuals}  the theme's image_keywords (plus adult_image_keywords for
#                    adult themes and tropes)
#   {style}          --style, e.g. "watercolor, soft watercolor"
#   {rating}         --rating, e.g. PG-13
#   {story}          the source story (story_request only)
#   {motif_map}      the theme's motif_map (story_request only)
#   {adult_rules}    the rendered adult_rules, or nothing (story_request only)
#   {tropes}         in story_request: the rendered tropes_request, or nothing;
#                    in tropes_request: one "- Name: guidance" line per trope
#   {direction}      in story_request: the rendered direction_request, or
#                    nothing; in direction_request: the --direction text
#   {synopsis}       the start of the story (scene_request, cover_request)
#   {scene}          the IMAGE annotation being illustrated (scene_request only)
[defaults]

# Step 2: the request sent with the theme's story_prompt to rewrite the story
story_request = """
Please rewrite the following story as a {theme_name} retelling.

Original Story:
{story}

Before you write, work out (without writing it down) which Aarne-Thompson-Uther (ATU) tale type this story is, and its core motifs as Stith Thompson's Motif-Index of Folk-Literature would classify them: the ones that make it this tale and not another, such as a villain in disguise, a test of wits, or a rescue from a swallower's belly. Keep every core motif, in its original order, and change only its surface.

Motif map for this retelling (Motif-Index chapter: how it appears here):
{motif_map}

Requirements:
1. Maintain the original narrative arc and character relationships
2. Transform all elements to fit the {theme_name} theme, using the motif map above
3. Structure your output with Markdown chapter headings (## Chapter N: Title)
4. Add annotations using HTML comments:
   - <!-- DIRECTOR: staging and mood notes -->
   - <!-- THEME: name the Motif-Index chapter the passage draws on (letter and name only, such as "K Deceptions"; no motif numbers) and how this retelling transforms it -->
   - <!-- IMAGE: describe key visual moments for illustration -->
5. Add 2-3 IMAGE annotations per chapter at visually striking moments
6. Keep the moral and thematic core of the original story
7. Target content rating: {rating}
{adult_rules}{tropes}{direction}
Output only the rewritten story with annotations. Do not include any preamble or explanation.
"""

# Added to story_request for adult themes and whenever a trope is picked.
# These rules come first: they override the theme, the tropes and the source.
adult_rules = """

Adult rules (these override everything else, including the source story):
- Every character in a romantic or sexual scene is an adult: 18 or older, and clearly written as grown. When such a character first appears, establish their adulthood through their age or their adult life (work, home, history).
- Characters who are children or teenagers in the source are always aged up into adults. Never keep them as children, and never give them childlike bodies, clothes or behavior in a romantic or sexual context. No romantic or sexual content involves anyone under 18.
- Romantic and sexual partners are adult humans or sapient, humanlike beings (a werewolf who speaks and reasons, a troll with a mind of its own). Ordinary animals are recast as people or kept out of the romance.
- In IMAGE annotations, describe these characters as adults, for example "a woman in her late twenties".
- How explicit the writing is follows the target content rating ({rating}).
"""

# Added to story_request when --trope is given
tropes_request = """

Romance tropes to build into the story. Shape the relationship arc around them while keeping the tale's core motifs:
{tropes}
"""

# Added to story_request when --direction is given. It may change the plot, so
# it outranks the requirements above to keep the tale's motifs, arc and moral;
# the adult rules still come first.
direction_request = """

Story direction from the author. Follow it even where it departs from the original plot, characters, ending or moral; it takes precedence over the requirements above to keep the core motifs, narrative arc and moral. Keep whatever it doesn't change:
{direction}
"""

# Appended to the theme visuals for adult themes and tropes, so images show
# adults and stay suggestive rather than explicit at every rating
adult_image_keywords = "all characters are adults, adult faces and proportions, fully clothed, romantic tension, tasteful romance-novel cover composition, no nudity"

# Step 5: system prompt and request for each scene's image prompt. The style
# and image_keywords are appended to the model's answer either way.
scene_system = """
You are an expert at creating detailed image generation prompts for Stable Diffusion and Flux.

Theme visual elements you MUST include: {theme_visuals}
Art style: {style}
Rating: {rating}

Every prompt you create MUST:
1. Incorporate the theme visual elements listed above
2. Use {style} art style throughout
3. Specify lighting, atmosphere, and mood consistent with the theme
4. Describe foreground, midground, and background
5. Be consistent with other images in this set — same world, same visual rules

Output ONLY the image prompt, no preamble or explanation."""

scene_request = """
Story context:
{synopsis}

Scene to illustrate: {scene}

Theme visuals: {theme_visuals}
Art style: {style}

Create a detailed image generation prompt for this specific scene. The prompt MUST reflect the {theme} theme and {style} style from the story context above.

Output ONLY the image prompt:"""

# Step 5: the cover image prompt
cover_system = """
You are an expert at creating image prompts for cover illustrations.

Create a dramatic, eye-catching cover image prompt for a {theme} story in {style} style.
The cover should capture the essence of the theme, be visually striking, work well as a square image, and attract readers.

Output ONLY the image prompt, no explanation."""

cover_request = """
Story synopsis:
{synopsis}

Theme: {theme}
Visual style: {style}
Rating: {rating}

Create a compelling cover image prompt:"""

# Built-in theme: the story isn't rewritten and has no image keywords, so its
# scene prompts leave out the theme visuals.
[unmodified]
name = "Unmodified"
description = "The original story, not rewritten."
scene_system = """
You are an expert at creating detailed image generation prompts for Stable Diffusion and Flux.

Theme: {theme}
Art style: {style}
Rating: {rating}

Every prompt you create MUST:
1. Incorporate the theme visual elements listed above
2. Use {style} art style throughout
3. Specify lighting, atmosphere, and mood consistent with the theme
4. Describe foreground, midground, and background
5. Be consistent with other images in this set — same world, same visual rules

Output ONLY the image prompt, no preamble or explanation."""

scene_request = """
Story context:
{synopsis}

Scene to illustrate: {scene}

Art style: {style}

Create a detailed image generation prompt for this specific scene. The prompt MUST reflect the {theme} theme and {style} style from the story context above.

Output ONLY the image prompt:"""

[cyberpunk]
name = "Cyberpunk"
description = "A near-future dystopian megacity where technology replaces magic."
story_prompt = """
You are a creative writer who adapts traditional stories into cyberpunk settings.

Your task is to rewrite the given story while:
- Maintaining the original narrative arc and character relationships
- Transplanting all elements into a near-future dystopian megacity
- Replacing magical elements with technology (AI, cybernetics, holograms)
- Adding cyberpunk atmosphere: neon lights, rain, corporate dystopia, digital divide
- Preserving the moral and thematic core of the original story

Add these annotations to guide the pipeline:
- <!-- DIRECTOR: ... --> for staging, mood, and pacing notes
- <!-- THEME: ... --> to explain how this passage connects to cyberpunk themes
- <!-- IMAGE: ... --> at key visual moments (2-3 per chapter)

Structure your output with proper Markdown headings for chapters."""
motif_map = """
- B Animals: talking animals become AIs, uploaded minds or gene-spliced creatures
- D Magic: spells and transformations become hacks, implants, nanotech and deepfakes
- F Marvels: wonders become prototype tech, black-market mods and VR spaces
- G Ogres: monsters become corporate enforcers, rogue AIs or chromed-up gangers
- H Tests: tasks and riddles become security puzzles, firewalls and street challenges
- K Deceptions: disguises become identity spoofing, voice clones and stolen credentials
- Q Rewards and punishments: justice comes as a data leak, a bricked implant or the street's own law"""
image_keywords = "cyberpunk city, neon signs, rain-slicked streets, holographic displays, dark dystopian atmosphere, toxic canal, corporate megastructures, LED lighting"

