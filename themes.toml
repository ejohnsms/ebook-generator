# ── Romance tropes ──────────────────────────────────────────────────────────
# Tropes from the bound2books smut guide, picked with --trope (any number).
# Each adds its guidance to the rewrite, along with [defaults] adult_rules.

[tropes.age_gap]
name = "Age Gap"
description = "A significant age difference between the leads."
guidance = "Give the leads a clear age difference that shapes how they see each other: experience against fresh eyes, different stages of life. Both are adults, and the younger is at least in their mid-twenties."

[tropes.billionaire]
name = "Billionaire"
description = "One lead is extremely wealthy; the other isn't."
guidance = "Make one lead enormously rich (the tale's lord, wolf or troll as a tycoon) and the other ordinary. Money, power and the worlds they move in are the obstacle, and the wealthy one has to learn what can't be bought."

[tropes.bodyguard]
name = "Bodyguard"
description = "One lead protects the other."
guidance = "Make one lead the other's protector: a hired guard, a huntsman or a sworn escort. The tale's danger is the threat; closeness, duty and the rule against falling for the client create the tension."

[tropes.bully]
name = "Bully"
description = "One lead bullied the other and has to earn redemption."
guidance = "One lead once tormented or belittled the other as adult rivals, coworkers or neighbors, not at school. The story turns on why, a reckoning, and real change before any romance is earned."

[tropes.captor_captive]
name = "Captor/Captive"
description = "One lead holds the other captive."
guidance = "Use the tale's capture or imprisonment as the setup: one lead holds the other. Build the romance through the shifting power between them, and turn on the captive gaining choice and freedom."

[tropes.celebrity]
name = "Celebrity"
description = "One lead is famous."
guidance = "Make one lead famous (a star, a public figure, a legend in their world) and the other not. Fame, scrutiny and the public persona against the real person drive the conflict."

[tropes.enemies_to_lovers]
name = "Enemies to Lovers"
description = "Antagonists become romantic partners."
guidance = "Make the leads true adversaries at the start: hero and villain, rivals, opposite sides. The romance grows through conflict, grudging respect and seeing past the role, and the tale's confrontation becomes the turning point."

[tropes.fake_relationship]
name = "Fake Relationship"
description = "The leads agree to pretend to be a couple."
guidance = "Have the leads agree to pretend to be together, to fool the tale's antagonist, a family or a community. Keeping up the pretense forces closeness until the feelings stop being fake."

[tropes.fated_mates]
name = "Fated Mates"
description = "The leads are destined to be together."
guidance = "The leads are bound by fate: a prophecy, a mark, a scent or a magic bond. Make the tension about whether they accept it, and whether destiny can become a choice."

[tropes.friends_to_lovers]
name = "Friends to Lovers"
description = "A friendship becomes a romance."
guidance = "Make the leads old friends or companions in the tale (fellow travelers, neighbors, partners in the quest). The danger or journey reveals what they've been missing, and they risk the friendship to say it."

[tropes.forced_proximity]
name = "Forced Proximity"
description = "The leads are confined together."
guidance = "Trap the leads together: snowed in, hiding from the tale's threat, sharing a cottage, a cell or a ship. Close quarters strip away defenses."

[tropes.grumpy_sunshine]
name = "Grumpy Sunshine"
description = "A grumpy lead paired with a cheerful one."
guidance = "Pair a gruff, guarded lead (the troll, the woodcutter, the wolf) with a warm, relentlessly cheerful one. The comedy and tenderness come from the sunshine wearing the grump down."

[tropes.hurt_comfort]
name = "Hurt/Comfort"
description = "One lead comforts the other through injury or grief."
guidance = "Have one lead hurt by the tale's events, in body or heart, and the other care for them. Intimacy grows through tending, trust and letting someone see you at your weakest."

[tropes.marriage_of_convenience]
name = "Marriage of Convenience"
description = "The leads marry without love."
guidance = "Have the leads marry for practical reasons: an inheritance, an alliance, protection from the tale's threat or a debt. Love grows inside a marriage that was meant to be a contract."

[tropes.only_one_bed]
name = "Only One Bed"
description = "The leads are forced to share a single bed."
guidance = "Put the leads somewhere with one bed (an inn, grandmother's cottage, a ship's cabin) and make them share it. Build the scene's tension and humor around it."

[tropes.power_imbalance]
name = "Power Imbalance"
description = "A significant power disparity between the leads."
guidance = "Give one lead clear power over the other: rank, wealth, magic or authority. Make the imbalance and how it shifts the center of the romance."

[tropes.relationship_coach]
name = "Relationship Coach"
description = "One lead teaches the other about intimacy."
guidance = "One lead agrees to coach the other in romance or intimacy, to win someone else, pass a test or save face. The lessons become real."

[tropes.second_chance]
name = "Second Chance"
description = "Former lovers reconnect."
guidance = "Make the leads former lovers parted by the past. The tale's events bring them back together, and they have to face why it ended before trying again."
