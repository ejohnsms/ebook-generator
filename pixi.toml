[workspace]
name = "ebook-generation"
version = "0.1.0"
description = "Generate themed, illustrated ebooks from story sources"
channels = ["conda-forge"]
# Solved inside the pipeline containers (Linux VMs on Apple Silicon), not on
# the host. Each stage image installs one environment; see Containerfile.
platforms = ["linux-aarch64"]

# Shared by every stage: the CLI, pipeline state, and the model-server client.
[dependencies]
python = ">=3.12,<3.13"

[pypi-dependencies]
click = ">=8.1"
httpx = ">=0.27"

# Steps 1-5: read the story, then theme, rate, translate and write image
# prompts through the host model server.
[feature.text.pypi-dependencies]
markdownify = ">=0.13"

# Step 7: Markdown + images -> ePub and PDF. The image has no system fonts:
# Libre Baskerville is the body serif, DejaVu the wide-coverage fallback.
[feature.compile.dependencies]
weasyprint = ">=62"
fonts-conda-ecosystem = "*"
font-libre-baskerville = "*"
font-ttf-dejavu = "*"

[feature.compile.pypi-dependencies]
markdown-it-py = ">=3.0"
ebooklib = ">=0.18"

# Step 8: Kokoro TTS on the CPU. espeak-ng (non-English voices) comes from
# misaki's espeakng-loader wheel; conda-forge has no linux-aarch64 build.
[feature.audio.dependencies]
numpy = ">=1.26"
pytorch = ">=2.5"

[feature.audio.pypi-dependencies]
kokoro = ">=0.9"
soundfile = ">=0.12"
# misaki downloads this with pip at runtime if it's missing
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[feature.dev.pypi-dependencies]
textual = ">=0.80"
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"

[environments]
text = ["text"]
images = []
compile = ["compile"]
audio = ["audio"]
# Tests and the TUI: every stage's packages in one image
dev = ["text", "compile", "audio", "dev"]
